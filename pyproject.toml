[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cinema"
version = "0.1.0"
description = "Script Notes-to-Outline Matrix Agent (ADK + Gemini on Vertex AI)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["clickhouse/schema.sql"]
