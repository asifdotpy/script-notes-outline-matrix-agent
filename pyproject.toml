[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cinema"
version = "0.1.0"
description = "Script Notes-to-Outline Matrix Agent (ADK + Gemini on Vertex AI)"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8.8",
    "itsdangerous>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.0.0",
    "mcp-clickhouse[chdb]>=0.1.0",
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.101.0",
    "google-genai>=0.3.0",
    "authlib>=1.7.0",
    "google-auth>=2.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["clickhouse/schema.sql"]

[tool.pytest.ini_options]
# Only our project's tests should be collected. The vendored `references/`
# subtree includes a copy of mcp-clickhouse's own test suite that imports private
# symbols and errors on import; it must never be collected as part of our CI run.
testpaths = ["tests"]
norecursedirs = ["references", "venv", ".venv", "node_modules"]
addopts = "-p no:cacheprovider"
