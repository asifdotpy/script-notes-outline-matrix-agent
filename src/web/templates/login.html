<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Agentic Cinema</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 flex items-center justify-center">
  <div class="w-full max-w-sm p-8 bg-white rounded-xl shadow-md border border-slate-200">
    <h1 class="text-xl font-semibold text-slate-800 mb-1">Agentic Cinema</h1>
    <p class="text-sm text-slate-500 mb-6">Script Notes-to-Outline Matrix — sign in</p>

    {% if not auth_enabled %}
      <div class="mb-4 p-3 text-sm rounded bg-amber-50 text-amber-700 border border-amber-200">
        Authentication is disabled (no <code>APP_PASSWORD</code> set). Set it to enable the login gate.
      </div>
    {% endif %}

    {% if error %}
      <div class="mb-4 p-3 text-sm rounded bg-red-50 text-red-700 border border-red-200">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus
               class="w-full px-3 py-2 border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <button type="submit"
              class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
