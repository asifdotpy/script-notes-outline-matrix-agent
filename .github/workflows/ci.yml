name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Create venv + install dependencies
        run: |
          uv venv --python 3.10
          uv pip install -r requirements.txt
          uv pip install pytest fpdf2

      - name: Run pytest (golden dataset, suites A-E, eval harness)
        # Embedded chDB (file-backed) is used — no ClickHouse Cloud account needed.
        env:
          CHDB_ENABLED: "true"
          CLICKHOUSE_ENABLED: "false"
          CLICKHOUSE_ALLOW_WRITE_ACCESS: "true"
        run: .venv/bin/python -m pytest -q

      - name: Run eval harness (accuracy/precision/recall regression gate)
        # Deterministic baseline gate only; the LLM >=85% quality gate is run
        # manually with a Gemini key for the submission video (not in CI).
        env:
          CHDB_ENABLED: "true"
          CLICKHOUSE_ENABLED: "false"
          CLICKHOUSE_ALLOW_WRITE_ACCESS: "true"
        run: .venv/bin/python tests/eval_harness.py
